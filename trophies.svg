<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FF006E"/>
      <stop offset="50%"  stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#00D9FF"/>
    </linearGradient>
    <linearGradient id="glowGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
  </defs>

  <style>
    .sans { font-family:'Segoe UI',Ubuntu,sans-serif; }
    @keyframes popIn { 0%{transform:scale(0.8);opacity:0;} 70%{transform:scale(1.05);} 100%{transform:scale(1);opacity:1;} }
    .trophy { opacity:0; animation: popIn .5s cubic-bezier(.22,.61,.36,1) forwards; transform-origin: center; transform-box: fill-box; }
    .t1{animation-delay:.1s;} .t2{animation-delay:.2s;} .t3{animation-delay:.3s;}
    .t4{animation-delay:.4s;} .t5{animation-delay:.5s;} .t6{animation-delay:.6s;}
    .t7{animation-delay:.7s;} .t8{animation-delay:.8s;}
    .card { fill:#161B22; stroke-width:1.5; transition: 0.3s; }
  </style>

  <rect width="600" height="340" rx="14" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="599" height="339" rx="14"
        fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.5"/>
  <rect x="20" y="0" width="560" height="3" rx="1.5" fill="url(#accent)" opacity="0.8"/>

  <text x="300" y="32" class="sans" font-size="16" font-weight="700"
        fill="#E6EDF3" text-anchor="middle">🏆 GitHub Trophies · Nimit746</text>

  <!-- Row 1 -->
  <!-- Trophy 1: Commits → 281 (Gold) -->
  <g transform="translate(30, 50)">
    <g class="trophy t1">
      <rect width="120" height="120" rx="12" class="card" stroke="#FFB800"/>
      <text x="60" y="42" font-size="34" text-anchor="middle">🥇</text>
      <text x="60" y="66" class="sans" font-size="10" fill="#FFB800" text-anchor="middle" font-weight="700">COMMITS</text>
      <text x="60" y="86" class="sans" font-size="22" fill="#FFD700" text-anchor="middle" font-weight="900">281</text>
      <rect x="25" y="98" width="70" height="14" rx="7" fill="#FFB80022"/>
      <text x="60" y="109" class="sans" font-size="9" fill="#FFB800" text-anchor="middle" font-weight="700">Gold</text>
    </g>
  </g>

  <!-- Trophy 2: Stars → 2 (Bronze) -->
  <g transform="translate(170, 50)">
    <g class="trophy t2">
      <rect width="120" height="120" rx="12" class="card" stroke="#CD7F32"/>
      <text x="60" y="42" font-size="34" text-anchor="middle">⭐</text>
      <text x="60" y="66" class="sans" font-size="10" fill="#CD7F32" text-anchor="middle" font-weight="700">STARS</text>
      <text x="60" y="86" class="sans" font-size="22" fill="#D4905A" text-anchor="middle" font-weight="900">2</text>
      <rect x="25" y="98" width="70" height="14" rx="7" fill="#CD7F3220"/>
      <text x="60" y="109" class="sans" font-size="9" fill="#CD7F32" text-anchor="middle" font-weight="700">Bronze</text>
    </g>
  </g>

  <!-- Trophy 3: Repos → 30 (Silver) -->
  <g transform="translate(310, 50)">
    <g class="trophy t3">
      <rect width="120" height="120" rx="12" class="card" stroke="#C0C0C0"/>
      <text x="60" y="42" font-size="34" text-anchor="middle">📦</text>
      <text x="60" y="66" class="sans" font-size="10" fill="#C0C0C0" text-anchor="middle" font-weight="700">REPOS</text>
      <text x="60" y="86" class="sans" font-size="22" fill="#D0D0D0" text-anchor="middle" font-weight="900">30</text>
      <rect x="25" y="98" width="70" height="14" rx="7" fill="#C0C0C020"/>
      <text x="60" y="109" class="sans" font-size="9" fill="#C0C0C0" text-anchor="middle" font-weight="700">Silver</text>
    </g>
  </g>

  <!-- Trophy 4: PRs → 9 (Bronze) -->
  <g transform="translate(450, 50)">
    <g class="trophy t4">
      <rect width="120" height="120" rx="12" class="card" stroke="#CD7F32"/>
      <text x="60" y="42" font-size="34" text-anchor="middle">🔀</text>
      <text x="60" y="66" class="sans" font-size="10" fill="#CD7F32" text-anchor="middle" font-weight="700">PULL REQS</text>
      <text x="60" y="86" class="sans" font-size="22" fill="#D4905A" text-anchor="middle" font-weight="900">9</text>
      <rect x="25" y="98" width="70" height="14" rx="7" fill="#CD7F3220"/>
      <text x="60" y="109" class="sans" font-size="9" fill="#CD7F32" text-anchor="middle" font-weight="700">Bronze</text>
    </g>
  </g>

  <!-- Row 2 -->
  <!-- Trophy 5: Issues → 18 (Bronze) -->
  <g transform="translate(30, 190)">
    <g class="trophy t5">
      <rect width="120" height="120" rx="12" class="card" stroke="#CD7F32"/>
      <text x="60" y="42" font-size="34" text-anchor="middle">🐛</text>
      <text x="60" y="66" class="sans" font-size="10" fill="#CD7F32" text-anchor="middle" font-weight="700">ISSUES</text>
      <text x="60" y="86" class="sans" font-size="22" fill="#D4905A" text-anchor="middle" font-weight="900">18</text>
      <rect x="25" y="98" width="70" height="14" rx="7" fill="#CD7F3220"/>
      <text x="60" y="109" class="sans" font-size="9" fill="#CD7F32" text-anchor="middle" font-weight="700">Bronze</text>
    </g>
  </g>

  <!-- Trophy 6: Python Ace (Purple) -->
  <g transform="translate(170, 190)">
    <g class="trophy t6">
      <rect width="120" height="120" rx="12" class="card" stroke="#8B5CF6"/>
      <text x="60" y="42" font-size="34" text-anchor="middle">🐍</text>
      <text x="60" y="66" class="sans" font-size="10" fill="#8B5CF6" text-anchor="middle" font-weight="700">PYTHON ACE</text>
      <text x="60" y="86" class="sans" font-size="22" fill="#A78BFA" text-anchor="middle" font-weight="900">55%</text>
      <rect x="25" y="98" width="70" height="14" rx="7" fill="#8B5CF622"/>
      <text x="60" y="109" class="sans" font-size="9" fill="#8B5CF6" text-anchor="middle" font-weight="700">Legend</text>
    </g>
  </g>

  <!-- Trophy 7: Open Sourcer (Pink) -->
  <g transform="translate(310, 190)">
    <g class="trophy t7">
      <rect width="120" height="120" rx="12" class="card" stroke="#FF006E"/>
      <text x="60" y="42" font-size="34" text-anchor="middle">🌐</text>
      <text x="60" y="66" class="sans" font-size="10" fill="#FF006E" text-anchor="middle" font-weight="700">OSS HUNTER</text>
      <text x="60" y="86" class="sans" font-size="16" fill="#FF4499" text-anchor="middle" font-weight="900">ACTIVE</text>
      <rect x="25" y="98" width="70" height="14" rx="7" fill="#FF006E22"/>
      <text x="60" y="109" class="sans" font-size="9" fill="#FF006E" text-anchor="middle" font-weight="700">Silver</text>
    </g>
  </g>

  <!-- Trophy 8: ROS Robotics (Cyan) -->
  <g transform="translate(450, 190)">
    <g class="trophy t8">
      <rect width="120" height="120" rx="12" class="card" stroke="#00D9FF"/>
      <text x="60" y="42" font-size="34" text-anchor="middle">🤖</text>
      <text x="60" y="66" class="sans" font-size="10" fill="#00D9FF" text-anchor="middle" font-weight="700">ROBOTICS</text>
      <text x="60" y="86" class="sans" font-size="16" fill="#66E8FF" text-anchor="middle" font-weight="900">ROS Dev</text>
      <rect x="25" y="98" width="70" height="14" rx="7" fill="#00D9FF22"/>
      <text x="60" y="109" class="sans" font-size="9" fill="#00D9FF" text-anchor="middle" font-weight="700">Gold</text>
    </g>
  </g>

  <rect x="20" y="337" width="560" height="3" rx="1.5" fill="url(#accent)" opacity="0.8"/>
</svg>