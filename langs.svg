<svg xmlns="http://www.w3.org/2000/svg" width="420" height="295" viewBox="0 0 420 295">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FF006E"/>
      <stop offset="50%"  stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#00D9FF"/>
    </linearGradient>
  </defs>

  <style>
    .sans { font-family:'Segoe UI',Ubuntu,sans-serif; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    @keyframes growW  { from { width:0; } to { } }
    .row { opacity:0; animation: fadeUp .4s ease-out forwards; }
    .r1{animation-delay:.1s;} .r2{animation-delay:.22s;} .r3{animation-delay:.34s;}
    .r4{animation-delay:.46s;} .r5{animation-delay:.58s;}
    .bar { animation: growW .8s ease-out forwards; }
  </style>

  <rect width="420" height="295" rx="14" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="419" height="294" rx="14"
        fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.5"/>
  <rect x="16" y="0" width="388" height="3" rx="1.5" fill="url(#accent)" opacity="0.8"/>

  <text x="16" y="30" class="sans" font-size="15" font-weight="700" fill="#E6EDF3">
    💬 Top Languages
  </text>
  <text x="404" y="30" class="sans" font-size="10" fill="#484F58" text-anchor="end">Nimit746 · Jul 2026</text>

  <!-- Progress bar strip: Python 55%, TypeScript 15%, C++ 12%, JavaScript 10%, CMake 8% -->
  <g transform="translate(16, 42)">
    <rect width="388" height="10" rx="5" fill="#21262D"/>
    <!-- Python: 55% → 213px -->
    <rect width="213" height="10" rx="5" fill="#3776AB" class="bar"/>
    <!-- TypeScript: 15% → 58px -->
    <rect x="213" width="58" height="10" rx="0" fill="#3178C6" class="bar" style="animation-delay:.1s"/>
    <!-- C++: 12% → 47px -->
    <rect x="271" width="47" height="10" rx="0" fill="#F34B7D" class="bar" style="animation-delay:.2s"/>
    <!-- JavaScript: 10% → 39px -->
    <rect x="318" width="39" height="10" rx="0" fill="#F7E018" class="bar" style="animation-delay:.3s"/>
    <!-- CMake/Shell: 8% → 31px with right radius -->
    <rect x="357" width="31" height="10" rx="5" fill="#47A248" class="bar" style="animation-delay:.4s"/>
  </g>

  <!-- Language rows -->
  <g transform="translate(16, 66)" class="sans" font-size="12">

    <g transform="translate(0,0)"><g class="row r1">
      <circle cx="6"  cy="5" r="5" fill="#3776AB"/>
      <text x="18" y="10" fill="#C9D1D9">Python</text>
      <text x="382" y="10" fill="#8B949E" text-anchor="end">55.0%</text>
      <rect x="18" y="18" width="348" height="5" rx="2.5" fill="#21262D"/>
      <rect x="18" y="18" width="191" height="5" rx="2.5" fill="#3776AB"
            style="animation: growW .8s ease-out .1s both;"/>
    </g></g>

    <g transform="translate(0,40)"><g class="row r2">
      <circle cx="6"  cy="5" r="5" fill="#3178C6"/>
      <text x="18" y="10" fill="#C9D1D9">TypeScript</text>
      <text x="382" y="10" fill="#8B949E" text-anchor="end">15.0%</text>
      <rect x="18" y="18" width="348" height="5" rx="2.5" fill="#21262D"/>
      <rect x="18" y="18" width="52" height="5" rx="2.5" fill="#3178C6"
            style="animation: growW .8s ease-out .2s both;"/>
    </g></g>

    <g transform="translate(0,80)"><g class="row r3">
      <circle cx="6"  cy="5" r="5" fill="#F34B7D"/>
      <text x="18" y="10" fill="#C9D1D9">C++</text>
      <text x="382" y="10" fill="#8B949E" text-anchor="end">12.0%</text>
      <rect x="18" y="18" width="348" height="5" rx="2.5" fill="#21262D"/>
      <rect x="18" y="18" width="42" height="5" rx="2.5" fill="#F34B7D"
            style="animation: growW .8s ease-out .3s both;"/>
    </g></g>

    <g transform="translate(0,120)"><g class="row r4">
      <circle cx="6"  cy="5" r="5" fill="#F7E018"/>
      <text x="18" y="10" fill="#C9D1D9">JavaScript</text>
      <text x="382" y="10" fill="#8B949E" text-anchor="end">10.0%</text>
      <rect x="18" y="18" width="348" height="5" rx="2.5" fill="#21262D"/>
      <rect x="18" y="18" width="35" height="5" rx="2.5" fill="#F7E018"
            style="animation: growW .8s ease-out .4s both;"/>
    </g></g>

    <g transform="translate(0,160)"><g class="row r5">
      <circle cx="6"  cy="5" r="5" fill="#47A248"/>
      <text x="18" y="10" fill="#C9D1D9">CMake / Shell</text>
      <text x="382" y="10" fill="#8B949E" text-anchor="end">8.0%</text>
      <rect x="18" y="18" width="348" height="5" rx="2.5" fill="#21262D"/>
      <rect x="18" y="18" width="28" height="5" rx="2.5" fill="#47A248"
            style="animation: growW .8s ease-out .5s both;"/>
    </g></g>

  </g>

  <rect x="16" y="292" width="388" height="3" rx="1.5" fill="url(#accent)" opacity="0.8"/>

</svg>